<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Pro To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>&#9745; My To-Do List</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?" autofocus>
            <button id="addBtn" title="Add Task">&#10133;</button>
        </div>

        <div class="controls">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="incomplete">Incomplete</button>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn" data-sort="alpha" title="Sort Alphabetically">&#9650; A-Z</button>
                <button class="sort-btn" data-sort="time" title="Sort by Creation Time">&#128337; Time</button>
            </div>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="footer" id="footer">
            <span id="taskCount"></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
